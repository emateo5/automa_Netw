### Variables del modelo de datos de la infraestructura de red
inter_trunk_access: &int_trunk_access
  mode: trunk
  trunk_mode: auto
  allowed_vlans: 10,20
  vlan: null

inter_trunk_core: &int_trunk_core
  mode: trunk
  trunk_mode: desirable
  allowed_vlans: 10,20,30
  vlan: null

inter_trunk_dc: &int_trunk_dc
  mode: trunk
  trunk_mode: auto
  allowed_vlans: 30
  vlan: null

inter_access: &int_access
  mode: access
  trunk_mode: null
  allowed_vlans: null

inrter_svi: &int_svi
  mode: svi
  trunk_mode: null
  allowed_vlans: null

### Modelo de Datos principal
modelo:
  metadatos:
    proyecto: "Simulacro de Caso de Uso Ansible"
    version: "1.0"
    autor: "Ed Scrimaglia"
    fecha_creacion: "2024-06-15"
    time_zone: "America/Argentina/Buenos_Aires"
  hosts_groups:
    access_switches: cisco_ios
    core_switches: cisco_ios_core
    data_center_switches: cisco_ios_datacenter
  infra_spec:
    devices:
      SW-Bld_A:
        management:
          ip: "10.2.0.103"
          interface: "GigabitEthernet0/0"
        interfaces:
          - name: "GigabitEthernet0/1"
            description: "Conexion a SW_CORE_1"
            <<: *int_trunk_access
          - name: "GigabitEthernet0/2"
            description: "Conexion a SW_CORE_2"
            <<: *int_trunk_access
          - name: "GigabitEthernet1/1"
            description: "Conexion a PC_ING_1"
            <<: *int_access
            vlan: 10
          - name: "GigabitEthernet1/2"
            description: "Conexion a PC_PROD_1"
            <<: *int_access
            vlan: 20
        vlans:
          - id: 10
            name: "Ingenieria"
          - id: 20
            name: "Produccion"
      SW-Bld_B:
        management:
          ip: "10.2.0.104"
          interface: "GigabitEthernet0/0"
        interfaces:
          - name: "GigabitEthernet0/1"
            description: "Conexion a SW_CORE_1"
            <<: *int_trunk_access
          - name: "GigabitEthernet0/2"
            description: "Conexion a SW_CORE_2"
            <<: *int_trunk_access
          - name: "GigabitEthernet1/1"
            description: "Conexion a PC_ING_2"
            <<: *int_access
            vlan: 10
          - name: "GigabitEthernet1/2"
            description: "Conexion a PC_PROD_2"
            <<: *int_access
            vlan: 20
        vlans:
          - id: 10
            name: "Ingenieria"
          - id: 20
            name: "Produccion"
      SW-Data_Center:
        management:
          ip: "10.2.0.105"
          interface: "GigabitEthernet0/0"
        interfaces:
          - name: "GigabitEthernet0/1"
            description: "Conexion a SW-CORE_1"
            <<: *int_trunk_dc
          - name: "GigabitEthernet0/2"
            description: "Conexion a SW-CORE_2"
            <<: *int_trunk_dc
          - name: "GigabitEthernet1/1"
            description: "Conexion a Servidor_WEB"
            <<: *int_access
            vlan: 30
        vlans:
          - id: 30
            name: "Finanzas"  
      SW-CORE_1:
        routing:
          name: eigrp
          as_number: 10
          router_id: "1.1.1.1"
          networks:
            - "192.168.10.0"
            - "192.168.20.0"
            - "192.168.30.0"
        management:
          ip: "10.2.0.101"
          interface: "GigabitEthernet0/0"
        interfaces:
          - name: "GigabitEthernet0/1"
            description: "Conexion a SW-Bld_A"
            <<: *int_trunk_core
          - name: "GigabitEthernet0/2"
            description: "Conexion a SW-Bld_B"
            <<: *int_trunk_core
          - name: "GigabitEthernet0/3"
            description: "Conexion a SW-Data_Center"
            <<: *int_trunk_core
          - name: Vlan10
            description: "SVI Ingenieria"
            ip_address: "192.168.10.250"
            mask: "255.255.255.0"
            vrrp_group: 10
            vrrp_priority: 1
            vrrp_ip: "192.168.10.254"
            <<: *int_svi
            vlan: 10
          - name: Vlan20
            description: "SVI Produccion"
            ip_address: "192.168.20.250"
            mask: "255.255.255.0"
            vrrp_group: 20
            vrrp_priority: 2
            vrrp_ip: "192.168.20.254"
            <<: *int_svi
            vlan: 20
          - name: Vlan30
            description: "SVI Finanzas"
            ip_address: "192.168.30.250"
            mask: "255.255.255.0"
            vrrp_group: 30
            vrrp_priority: 1
            vrrp_ip: "192.168.30.254"
            <<: *int_svi
            vlan: 30
        vlans:
          - id: 10
            name: "Ingenieria"
          - id: 20
            name: "Produccion"
          - id: 30
            name: "Finanzas"
      SW-CORE_2:
        routing:
          name: eigrp
          as_number: 10
          router_id: "1.1.1.3"
          networks:
            - "192.168.10.0"
            - "192.168.20.0"
            - "192.168.30.0"
        management:
          ip: "10.2.0.102"
          interface: "GigabitEthernet0/0"
        interfaces:
          - name: "GigabitEthernet0/1"
            description: "Conexion a SW-Bld_B"
            <<: *int_trunk_core
          - name: "GigabitEthernet0/2"
            description: "Conexion a SW-Bld_A"
            <<: *int_trunk_core
          - name: "GigabitEthernet0/3"
            description: "Conexion a SW-Data_Center"
            <<: *int_trunk_core
          - name: Vlan10
            description: "SVI Ingenieria"
            ip_address: "192.168.10.251"
            mask: "255.255.255.0"
            vrrp_group: 10
            vrrp_priority: 2
            vrrp_ip: "192.168.10.254"
            <<: *int_svi
            vlan: 10
          - name: Vlan20
            description: "SVI Produccion"
            ip_address: "192.168.20.251"
            mask: "255.255.255.0"
            vrrp_group: 20
            vrrp_priority: 1
            vrrp_ip: "192.168.20.254"
            <<: *int_svi
            vlan: 20
          - name: Vlan30
            description: "SVI Finanzas"
            ip_address: "192.168.30.251"
            mask: "255.255.255.0"
            vrrp_group: 30
            vrrp_priority: 2
            vrrp_ip: "192.168.30.254"
            <<: *int_svi
            vlan: 30
        vlans:
          - id: 10
            name: "Ingenieria"
          - id: 20
            name: "Produccion"
          - id: 30
            name: "Finanzas"
  