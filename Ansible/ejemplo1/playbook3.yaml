# Playbook para leer el modelo de datos y usar el atributo hosts_group en hosts
# By Ed Scrimaglia

---
- name: Playbook que usa variables en el parametro hosts
  hosts: "{{ modelo.infra_spec.hosts_group }}"
  gather_facts: false

  vars_files:
    - ./modelo_datos/modelo_datos.yaml

  tasks:
    - name: Mostrar interfaces de cada dispositivo
      cisco.ios.ios_command:
        commands:
          - show ip interface brief
      register: interface_output

    - name: Visializar salida de interfaces
      ansible.builtin.debug:
        var: interface_output.stdout_lines
