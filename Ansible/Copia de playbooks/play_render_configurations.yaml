- name: Creación routing EIGRP en switches de core
  hosts: "{{ modelo.hosts_groups.core_switches }}"
  gather_facts: false

  vars_files:
    - ../modelo_datos/modelo.yaml

  tasks:
    - name: Define variables para plantillas
      ansible.builtin.set_fact:
        routing: "{{ modelo.infra_spec.devices[inventory_hostname].routing }}"
      register: set_device_vars

    - name: Render EIGRP configuration
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/eigrp_{{item.type}}.j2"
        dest: "{{ playbook_dir }}/{{item.path_d}}/{{item.beg}}{{ inventory_hostname }}_eigrp.{{item.ext}}"
        mode: '0644'
      loop:
        - {path_d: "../configs", ext: cfg, type: cfg, beg: ''}
        - {path_d: "../documentacion/modulos", ext: md, type: doc, beg: '1.5'}
      register: render_eigrp

