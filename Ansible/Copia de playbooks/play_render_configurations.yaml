- name: Titulo Reporte de Automatización de Configuraciones de Red
  hosts: localhost
  gather_facts: false

  vars_files:
    - ../modelo_datos/modelo.yaml

  tasks:
    - include_tasks: ../tasks/task_timestamp.yaml 

    - name: Define variables para plantillas
      ansible.builtin.set_fact:
        servicio: "{{ modelo.metadatos.proyecto }}"
        date: "{{ date_local.stdout[0:10]}}"
        time: "{{ date_local.stdout[11:]}}"
      register: set_device_vars

    - name: Render Titulo Reporte de Automatización de Configuraciones de Red
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/titulo_reporte_{{item.type}}.j2"
        dest: "{{ playbook_dir }}/{{item.path_d}}/{{item.beg}}Titulo_reporte.{{item.ext}}"
        mode: '0644'
      loop:
        - {path_d: "../documentacion/modulos", ext: md, type: doc, beg: '1.0'}
      register: render_vlans
